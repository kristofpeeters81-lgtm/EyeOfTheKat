# Publiceert The Eye of the Kat op GitHub Pages (gratis): https://<account>.github.io/EyeOfTheKat/
# Draait bij elke push naar main. Eerst tests en de privacycontrole (#48); faalt er iets, dan blijft
# de vorige versie online.

name: Website (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Tests (incl. privacycontrole)
        run: npm test

      - name: Web-app bouwen (incl. privacycontrole op de build)
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
